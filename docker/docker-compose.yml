version: '3.9'

networks:
  service:
    driver: bridge
  tool:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres
    networks:
      - service
      - tool
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: no
    env_file:
      - path: .env
    ports:
      - ${POSTGRES_PORT_OUTER}:${POSTGRES_PORT_INNER}

  database-manager:
    container_name: database-manager
    networks:
      - service
    build:
      context: ../database-manager
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    restart: no
    env_file:
      - path: .env
    ports:
      - "9090:9090"
