version: '3.9'

networks:
  service:
    driver: bridge
  tool:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres
    networks:
      - service
      - tool
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: no
    env_file:
      - path: .env
    ports:
      - ${POSTGRES_PORT_OUTER}:${POSTGRES_PORT_INNER}

  service-discovery:
    container_name: service-discovery
    build:
      context: ../service-discovery
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    env_file:
      - .env
    restart: no
    ports:
      - ${SERVICE_DISCOVERY_PORT_OUTER}:${SERVICE_DISCOVERY_PORT_INNER}

  database-manager:
    container_name: database-manager
    networks:
      - service
    build:
      context: ../database-manager
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    restart: no
    env_file:
      - path: .env

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    networks:
      - service
      - tool
    container_name: ${KEYCLOAK_HOST}
    command:
      - start-dev
      - --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_NAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT_INNER}/${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HTTP_PORT=${KEYCLOAK_PORT_INNER}
    volumes:
      - ../configuration/keycloak/realm/import/realm-import.json:/opt/keycloak/data/import/realm-config.json:ro
    env_file:
      - .env
    ports:
      - ${KEYCLOAK_PORT_OUTER}:${KEYCLOAK_PORT_INNER}

  authentication-service:
    container_name: authentication-service
    build:
      context: ../authentication-service
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    restart: no
    env_file:
      - .env

  vacancy-manager-service:
    container_name: vacancy-manager-service
    build:
      context: ../vacancy-manager-service
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    restart: no
    env_file:
      - .env

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    restart: no
    env_file:
      - .env

  nginx:
    image: nginx
    networks:
      - tool
      - service
    volumes:
      - ../configuration/nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file:
      - .env
    ports:
      - ${NGINX_PORT_OUTER}:${NGINX_PORT_INNER}