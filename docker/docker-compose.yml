version: '3.9'

networks:
  service:
    driver: bridge
  tool:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres
    networks:
      - service
      - tool
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: no
    env_file:
      - path: .env
    ports:
      - ${POSTGRES_PORT_OUTER}:${POSTGRES_PORT_INNER}

  service-discovery:
    container_name: service-discovery
    build:
      context: ../service-discovery
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    env_file:
      - .env
    restart: no
    ports:
      - ${SERVICE_DISCOVERY_PORT_OUTER}:${SERVICE_DISCOVERY_PORT_INNER}

  database-manager:
    container_name: database-manager
    networks:
      - service
    build:
      context: ../database-manager
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    restart: no
    env_file:
      - path: .env

  nginx:
    image: nginx
    networks:
      - tool
      - service
    volumes:
      - ../configuration/nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file:
      - .env
    ports:
      - ${NGINX_PORT_OUTER}:${NGINX_PORT_INNER}

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION}
    networks:
      - service
    restart: no
    env_file:
      - .env

