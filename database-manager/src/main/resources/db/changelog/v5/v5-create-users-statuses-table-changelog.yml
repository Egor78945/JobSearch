databaseChangeLog:
  - changeSet:
      id: v5-1
      author: egor78396@gmail.com
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users_statuses
      changes:
        - createTable:
            tableName: users_statuses
            columns:
              - column:
                  name: user_uuid
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: statuses_users_fk
                    referencedTableName: users
                    referencedColumnNames: uuid
              - column:
                  name: status_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: statuses_status_fk
                    referencedTableName: user_status
                    referencedColumnNames: id