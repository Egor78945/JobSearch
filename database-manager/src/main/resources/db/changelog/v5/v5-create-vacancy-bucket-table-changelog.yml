databaseChangeLog:
  - changeSet:
      id: v5-1
      author: egor78396@gmail.com
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: vacancy_bucket
      changes:
        - createTable:
            tableName: vacancy_bucket
            columns:
              - column:
                  name: user_uuid
                  type: uuid
                  constraints:
                    nullable: false
                    referencedTableName: users
                    referencedColumnNames: uuid
              - column:
                  name: vacancy_uri
                  type: varchar
                  constraints:
                    nullable: false