spring:
  application:
    name: vacancy-manager-service

eureka:
  client:
    service-url:
      defaultZone: http://${SERVICE_DISCOVERY_HOST}:${SERVICE_DISCOVERY_PORT_INNER}/eureka
    register-with-eureka: true
    fetch-registry: true

api:
  hh:
    vacancies:
      uri: https://api.hh.ru/vacancies
    token:
      uri: https://api.hh.ru/token

server:
  port: ${VACANCY_MANAGER_SERVICE_PORT}
